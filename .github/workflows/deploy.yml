name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploy'lar navbat bilan: yangi push oldingisini bekor qilmaydi
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v4 Node 20 da ishlaydi, u esa runner'larda eskirgan deb belgilangan
      - uses: actions/checkout@v5
      # npm ci + astro build + upload-pages-artifact ni o'zi bajaradi.
      # `cache: true` (standart) node_modules/.astro ni keshlaydi —
      # optimizatsiya qilingan rasmlar har build'da qaytadan chizilmaydi.
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
